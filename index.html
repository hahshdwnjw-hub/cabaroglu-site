<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabaroğlu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Sağ Üst Neon Müzik Kutusu */
        .music-box {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #16161a;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 12px #00f3ff;
            border-radius: 10px;
            padding: 8px 12px;
            z-index: 1000;
        }
        .music-btn {
            background: transparent;
            border: none;
            color: #00f3ff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-shadow: 0 0 5px #00f3ff;
            outline: none;
        }

        /* Başlık */
        h1.title {
            margin-top: 40px;
            margin-bottom: 25px;
            font-size: 2.2rem;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        /* Ürünler Izgarası */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }
        .card {
            background: #18181c;
            border: 1px solid #ff007f;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
        }
        .card.full-width {
            grid-column: span 2;
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .price {
            color: #ff007f;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 8px #ff007f;
        }

        /* İletişim Kutusu */
        .contact-box {
            width: 100%;
            max-width: 500px;
            background: #121215;
            border: 2px solid #00f3ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 15px #00f3ff;
            text-align: center;
        }
        .contact-box h2 {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            color: #fff;
            text-align: center;
            font-size: 1rem;
        }
        .btn-wa {
            background-color: #25d366;
            box-shadow: 0 0 8px #25d366;
        }
        .btn-fb {
            background-color: #0084ff;
            box-shadow: 0 0 8px #0084ff;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- Müzik Kutusu -->
    <div class="music-box">
        <button id="musicToggle" class="music-btn" onclick="toggleMusic()">🎵 Müzik Başlat</button>
    </div>

    <!-- Müzik Kaynağı (Arayı Arayı) -->
    <audio id="bgMusic" loop>
        <source src="https://upload.wikimedia.org/wikipedia/commons/2/20/Aray%C4%B1_Aray%C4%B1_Bulsam_Izini.ogg" type="audio/ogg">
    </audio>

    <h1 class="title">Cabaroğlu</h1>

    <!-- Ürün Kartları -->
    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1626074353765-517a681e40be?w=400" alt="Bükme">
            <h3>Bükme</h3>
            <div class="price">20 TL</div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400" alt="Yufka">
            <h3>Yufka</h3>
            <div class="price">20 TL</div>
        </div>
        <div class="card full-width">
            <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500" alt="Bazlama">
            <h3>Bazlama</h3>
            <div class="price">30 TL</div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400" alt="Poğaça">
            <h3>Poğaça</h3>
            <div class="price">20 TL</div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1623334044303-241021148842?w=400" alt="Simit">
            <h3>Simit</h3>
            <div class="price">20 TL</div>
        </div>
    </div>

    <!-- İletişim Alanı -->
    <div class="contact-box">
        <h2>İLETİŞİM</h2>
        <a href="https://wa.me/905312092005" class="btn btn-wa" target="_blank">WhatsApp 1</a>
        <a href="https://wa.me/905462099151" class="btn btn-wa" target="_blank">WhatsApp 2</a>
        <a href="https://m.me/" class="btn btn-fb" target="_blank">Facebook Messenger</a>
    </div>

    <script>
        function toggleMusic() {
            var audio = document.getElementById("bgMusic");
            var btn = document.getElementById("musicToggle");
            
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "⏹️ Durdur";
                btn.style.color = "#ff007f";
                btn.style.textShadow = "0 0 5px #ff007f";
                btn.parentElement.style.borderColor = "#ff007f";
                btn.parentElement.style.boxShadow = "0 0 12px #ff007f";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Müzik Başlat";
                btn.style.color = "#00f3ff";
                btn.style.textShadow = "0 0 5px #00f3ff";
                btn.parentElement.style.borderColor = "#00f3ff";
                btn.parentElement.style.boxShadow = "0 0 12px #00f3ff";
            }
        }
    </script>

</body>
</html>
