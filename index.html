<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <title>Cabaroğlu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }

        /* Sol Üst Üç Nokta Menü Butonu */
        .menu-icon-container {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        .dots-btn {
            background: #1e1e1e;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            font-size: 1.5rem;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            transition: 0.3s;
        }
        .dots-btn:hover {
            background: #00f3ff;
            color: #121212;
        }

        /* İletişim Açılır Kutusu (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a1a;
            border: 3px solid #00f3ff;
            padding: 25px;
            width: 85%;
            max-width: 350px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            text-align: left;
            position: relative;
        }
        .modal-content h3 {
            color: #00f3ff;
            text-align: center;
            margin-top: 0;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }
        .modal-content p {
            color: #fff;
            font-size: 1rem;
            margin: 10px 0;
        }

            position: absolute;
            top: 8px
    <div class="menu-grid">
