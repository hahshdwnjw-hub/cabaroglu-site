<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabaroğlu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }

        /* Sol Üst Üç Nokta Menü Butonu */
        .menu-icon-container {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        .dots-btn {
            background: #1e1e1e;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            font-size: 1.5rem;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
            transition: 0.3s;
        }
        .dots-btn:hover {
            background: #00f3ff;
            color: #121212;
        }

        /* İletişim Açılır Kutusu (Neon Mavi Işıklı Kare Kutu) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #121212;
            border: 3px solid #00f3ff;
            padding: 30px;
            width: 90%;
            max-width: 360px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.4);
            text-align: left;
            position: relative;
        }
        .modal-content h3 {
            color: #00f3ff;
            text-align: center;
            margin-top: 0;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            letter-spacing: 1px;
        }
        .modal-content p {
            margin: 15px 0;
            font-size: 1.1rem;
        }
        .modal-content a {
            color: #00f3ff;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
            transition: 0.2s;
        }
        .modal-content a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff2a6d;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.8);
        }

        /* Üst Müzik Butonu */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 5px 15px;
        }
        .music-btn {
            background: transparent;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            transition: 0.3s;
        }
        .music-btn:hover {
            background: #00f3ff;
            color: #121212;
        }

        /* Neon Mavi Çerçeveli CABAR OĞLU Başlık Kutusu */
        .title-box {
            display: inline-block;
            border: 3px solid #00f3ff;
            padding: 15px 35px;
            border-radius: 12px;
            margin: 20px auto;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.7), inset 0 0 10px rgba(0, 243, 255, 0.3);
            background: rgba(0, 243, 255, 0.05);
        }
        h1 {
            color: #00f3ff;
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.9), 0 0 25px rgba(0, 243, 255, 0.6);
            letter-spacing: 2px;
        }

        /* Menü Grid ve Kartlar (Neon Mor Kenarlıklar) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 20px auto;
            padding: 10px;
        }
        .menu-card {
            background: #1e1e1e;
            border: 2px solid #b000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(176, 0, 255, 0.6);
            transition: transform 0.2s;
        }
        .menu-card:hover {
            transform: translateY(-5px);
        }
        .menu-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .menu-info {
            padding: 15px;
        }
        .menu-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .menu-price {
            font-size: 1.2rem;
            color: #b000ff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(176, 0, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="menu-icon-container">
        <button class="dots-btn" onclick="openModal()">⋮</button>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>İLETİŞİM</h3>
            <p>📞 <a href="tel:+905312092005">+90 531 209 20 05</a></p>
            <p>📞 <a href="tel:+905462099151">+90 546 209 91 51</a></p>
            <p>💬 <a href="https://m.me/cabaroglu" target="_blank">Facebook: Cabar oğlu</a></p>
        </div>
    </div>

    <div class="top-bar">
        <button id="musicBtn" class="music-btn" onclick="toggleMusic()">🎵 Müzik Başlat</button>
    </div>

    <div class="title-box">
        <h1>CABAR OĞLU</h1>
    </div>

    <div class="menu-grid">
        <div class="menu-card">
            <img src="bukme.jpg" alt="Bükme">
            <div class="menu-info">
                <div class="menu-title">Bükme</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>

        <div class="menu-card">
            <img src="yufka.jpg" alt="Yufka">
            <div class="menu-info">
                <div class="menu-title">Yufka</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>

        <div class="menu-card" style="grid-column: 1 / -1;">
            <img src="bazlama.jpg" alt="Bazlama" style="height: 220px;">
            <div class="menu-info">
                <div class="menu-title">Bazlama</div>
                <div class="menu-price">30 TL</div>
            </div>
        </div>

        <div class="menu-card">
            <img src="pogaca.jpg" alt="Poğaça">
            <div class="menu-info">
                <div class="menu-title">Poğaça</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>

        <div class="menu-card">
            <img src="simit.jpg" alt="Simit">
            <div class="menu-info">
                <div class="menu-title">Simit</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="halil-ibrahim.m4a" type="audio/mp4">
    </audio>

    <script>
        function openModal() {
            document.getElementById("infoModal").style.display = "flex";
        }
        function closeModal() {
            document.getElementById("infoModal").style.display = "none";
        }
        window.onclick = function(event) {
            let modal = document.getElementById("infoModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        function toggleMusic() {
            var music = document.getElementById("bgMusic");
            var btn = document.getElementById("musicBtn");
            if (music.paused) {
                music.play().then(() => {
                    btn.innerText = "🔇 Müziği Durdur";
                }).catch(error => {
                    alert("Müzik çalınamadı. Tarayıcı izin vermiyor olabilir.");
                });
            } else {
                music.pause();
                btn.innerText = "🎵 Müzik Başlat";
            }
        }
    </script>

</body>
</html>
