<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabaroğlu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        .logo {
            max-width: 180px;
            width: 100%;
            height: auto;
            margin: 10px auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.4);
        }
        h1 {
            color: #ff2a6d;
            font-size: 2.2rem;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255, 42, 109, 0.5);
        }
        .music-btn {
            background: transparent;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: 0.3s;
        }
        .music-btn:hover {
            background: #00f3ff;
            color: #121212;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 20px auto;
            padding: 10px;
        }
        .menu-card {
            background: #1e1e1e;
            border: 2px solid #ff2a6d;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.2);
            transition: transform 0.2s;
        }
        .menu-card:hover {
            transform: translateY(-5px);
        }
        .menu-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .menu-info {
            padding: 15px;
        }
        .menu-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .menu-price {
            font-size: 1.2rem;
            color: #ff2a6d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Üst Bar ve Müzik Butonu -->
    <div style="display: flex; justify-content: flex-end; padding: 10px;">
        <button class="music-btn" onclick="toggleMusic()">🎵 Müzik Başlat</button>
    </div>

    <!-- Yazısız ve Temizlenmiş Logo -->
    <img src="cabaroglu-logo.png" alt="Cabaroğlu Logo" class="logo">
    
    <h1>Cabaroğlu</h1>

    <!-- Menü Kartları -->
    <div class="menu-grid">
        <div class="menu-card">
            <img src="0ce6f1c6693cf29fb137ae5f5b2d370.jpg" alt="Bükme">
            <div class="menu-info">
                <div class="menu-title">Bükme</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>

        <div class="menu-card">
            <img src="3049e1745fa611b06fd9a426bee9e27e.jpg" alt="Yufka">
            <div class="menu-info">
                <div class="menu-title">Yufka</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>

        <div class="menu-card" style="grid-column: 1 / -1;">
            <img src="4342d50fb754dc2b98ac9850cb547b4b.jpg" alt="Bazlama" style="height: 220px;">
            <div class="menu-info">
                <div class="menu-title">Bazlama</div>
                <div class="menu-price">30 TL</div>
            </div>
        </div>

        <div class="menu-card">
            <img src="78e4869d982a8c62416547d3ee856265.jpg" alt="Poğaça">
            <div class="menu-info">
                <div class="menu-title">Poğaça</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>

        <div class="menu-card">
            <img src="dc5973100a40fdocae36ef610cbed216.jpg" alt="Simit">
            <div class="menu-info">
                <div class="menu-title">Simit</div>
                <div class="menu-price">20 TL</div>
            </div>
        </div>
    </div>

    <!-- Arka Plan Müzik Kontrolü için Gizli Element (İsteğe bağlı eklenebilir) -->
    <audio id="bgMusic" loop>
        <!-- <source src="muzik-dosyaniz.mp3" type="audio/mpeg"> -->
    </audio>

    <script>
        function toggleMusic() {
            var music = document.getElementById("bgMusic");
            if (music.paused) {
                // music.play(); Uncomment when audio source is added
                alert("Müzik çalmak için kaynak eklemelisiniz.");
            } else {
                music.pause();
            }
        }
    </script>

</body>
</html>
